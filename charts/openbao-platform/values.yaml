# =============================================================================
# openbao-platform
# =============================================================================
# An umbrella around the official OpenBao chart. Everything under `openbao:` is
# passed straight through to the subchart; every other top-level key belongs to
# this chart.
#
# Read docs/ARCHITECTURE.md before changing the TLS or listener settings — the
# two-listener split is load-bearing and several values must agree with the raft
# HCL further down this file.
# =============================================================================

# DNS domain of the cluster. Only change this if your kubelet was installed with
# a non-default --cluster-domain.
clusterDomain: cluster.local

# Scheduling priority for every workload this chart creates. Per-component
# overrides live under bootstrap/auditProxy/snapshotAgent/restore.
#
# OpenBao being evicted under node pressure takes every dependent workload with
# it, so it usually deserves a high class. `system-cluster-critical` (value
# 2000000000) ships with every cluster and, despite the name, is usable outside
# kube-system — verified by a server-side dry-run.
#
# NOTE: the OpenBao StatefulSet reads openbao.server.priorityClassName, not
# this. Helm cannot template subchart values, so the two are set separately;
# _validate.tpl fails the render if this is set and the server's is not, rather
# than leaving the one workload that matters unprioritised.
priorityClassName: ""

deployment:
  # "development" or "production".
  #
  # This is the FIRST of the two conditions that let the bootstrap Job print
  # unseal/recovery keys and the root token to its log. See
  # bootstrap.keyOutput.revealWhenDebug.
  environment: production

# -----------------------------------------------------------------------------
# Namespace
# -----------------------------------------------------------------------------
# Helm's own --create-namespace makes a namespace with no Pod Security labels,
# which is the wrong default for OpenBao. Either let this chart own the
# namespace (create: true, and do NOT pass --create-namespace), or create it
# yourself with the labels below. On OpenShift, PSA labels are ignored in favour
# of SCCs and are harmless.
namespace:
  create: false
  # Applied only when create is true.
  podSecurity:
    enforce: restricted
    audit: restricted
    warn: restricted
  labels: {}
  annotations: {}

# -----------------------------------------------------------------------------
# TLS — two trust domains, deliberately kept apart
# -----------------------------------------------------------------------------
# BACKEND (a.k.a. "internal"): port 8200. Carries raft join, request forwarding,
#   service registration, probes, the snapshot agent and every in-cluster
#   client. Its CA is the ONLY CA a raft join will accept
#   (storage.raft.retry_join.leader_ca_cert_file).
#
# FRONTEND (a.k.a. "server"): port 8210. Carries nothing but human/ingress
#   traffic. Issued by a different Issuer, usually your corporate or public CA.
#
# Compromising the frontend CA therefore does not let an attacker impersonate a
# raft peer, which is the whole point of the split.
#
# NOTE ON PORT NUMBERS: the backend listener is on 8200 and the frontend on 8210,
# which is the reverse of what you might expect. The upstream chart hardcodes
# 8200 in its readiness probe, Services, service registration and snapshot-agent
# ConfigMap; putting the in-cluster trust domain there means all of that keeps
# working untouched. The frontend is the one thing that only the Ingress/Route
# needs to reach, so it is the one that moves.
#
# NOTE ON RAFT: OpenBao generates and rotates the mTLS certificates for the
# cluster port (8201) itself; they are exchanged over the API port when a node
# joins. cert-manager cannot and should not issue those. What cert-manager owns
# here is the API-port certificate that the join handshake is validated against.
tls:
  enabled: true

  # A namespace-local CA that anchors the BACKEND trust domain.
  #
  # Deliberately not a ClusterIssuer: nothing outside this namespace should be
  # able to mint a certificate that a raft peer would accept. Set create: false
  # and point tls.internal.issuerRef at your own Issuer if you already run a
  # backend PKI (e.g. an intermediate from an offline root).
  # NOTE ON THE LITERAL SECRET NAMES BELOW
  # Helm does not template subchart values, so openbao.server.volumes has to
  # name these Secrets as plain strings. If they defaulted to something derived
  # from the release name, renaming the release would silently break the mount.
  # Pinning them here keeps the two halves in step for ANY release name, and
  # _validate.tpl still fails the render if one side is changed alone.
  # Installing two releases of this chart into ONE namespace requires giving
  # each its own names here and in openbao.server.volumes.
  ca:
    create: true
    secretName: openbao-backend-ca
    commonName: ""            # default: "<fullname> backend CA"
    duration: 87600h          # 10 years
    renewBefore: 720h         # 30 days
    privateKey:
      algorithm: ECDSA
      size: 384
    # The self-signed Issuer used to bootstrap the CA above. Harmless to leave
    # on; ignored when ca.create is false.
    selfSignedIssuerName: ""  # default: <fullname>-selfsigned

  internal:
    # Port for the backend listener. Also the cluster's api_addr port.
    port: 8200
    # Cluster (raft/request-forwarding) port. OpenBao owns the certs here.
    clusterPort: 8201
    secretName: openbao-tls-internal
    mountPath: /openbao/tls/internal
    # Leave empty to use the CA this chart creates.
    issuerRef:
      name: ""
      kind: Issuer
      group: cert-manager.io
    duration: 2160h           # 90 days
    renewBefore: 720h         # 30 days
    privateKey:
      algorithm: ECDSA
      size: 256
      rotationPolicy: Always
    # Extra SANs beyond the pod/service names this chart computes.
    extraDnsNames: []
    extraIpAddresses: []
    # Require client certificates from the backend CA on port 8200.
    # Hardens raft join and in-cluster access to true mTLS, but every in-cluster
    # client then needs a certificate — including the snapshot agent, which this
    # chart wires up for you. Leave off unless you have audited every consumer.
    mutualTls: false

  server:
    # The frontend listener, and with it the second trust domain.
    #
    # OFF by default so the chart renders and installs out of the box as a
    # single-trust-domain deployment. Turning it on is deliberate and needs
    # THREE things set together, because a certificate with no subject and a
    # listener with no certificate are both fatal:
    #
    #   1. enabled: true
    #   2. issuerRef.name  — a DIFFERENT issuer from the backend CA
    #   3. dnsNames        — at least the Ingress/Route host
    #
    # and a matching `https-frontend` entry in openbao.server.extraPorts, which
    # is what makes the raft HCL emit the listener. _validate.tpl fails the
    # render if any of these disagree. See values-heathernetes.yaml for a
    # worked example.
    enabled: false
    port: 8210
    secretName: openbao-tls-server
    mountPath: /openbao/tls/server
    # A DIFFERENT issuer from the backend CA — that is the entire point.
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    # Hostnames clients use. Must include the Ingress/Route host.
    dnsNames: []
    ipAddresses: []
    duration: 2160h
    renewBefore: 720h
    privateKey:
      algorithm: ECDSA
      size: 256
      rotationPolicy: Always

# -----------------------------------------------------------------------------
# Bootstrap
# -----------------------------------------------------------------------------
# A single-completion Job that initialises the cluster, unseals it, and lays
# down audit, auth and policy configuration.
#
# "Only runs on one node" is enforced structurally, not by convention: a Job
# with parallelism 1 and completions 1 produces exactly one Pod, and the script
# is additionally guarded by `bao status` so a re-run against an already
# initialised cluster reconfigures rather than re-initialises. That makes it
# safe as a post-upgrade hook and safe to re-run by hand.
bootstrap:
  enabled: true

  # Runs the `bao` CLI. Defaults to the same image as the server, so an airgap
  # mirror needs no extra artifact for this.
  image:
    registry: ""              # default: openbao.server.image.registry
    repository: ""            # default: openbao.server.image.repository
    tag: ""                   # default: openbao.server.image.tag / appVersion
    pullPolicy: IfNotPresent

  # The OpenBao image ships busybox wget, which cannot PATCH/DELETE and cannot
  # be pointed at the cluster CA — so it cannot write the key Secret. An
  # initContainer copies a kubectl binary out of this image into a shared
  # emptyDir instead. This is the SECOND (and last) image to mirror for airgap.
  kubectlImage:
    registry: docker.io
    repository: alpine/kubectl
    tag: "1.34.1"
    pullPolicy: IfNotPresent

  # Run as a Helm post-install/post-upgrade hook rather than a plain Job.
  # Off by default because hook Jobs are invisible to ArgoCD/Flux drift
  # detection and their logs are deleted on the next release.
  hook:
    enabled: false
    weight: 5
    deletePolicy: before-hook-creation

  backoffLimit: 6
  activeDeadlineSeconds: 1800
  # Leave null to keep finished Job pods (and their logs) around. Set a number
  # of seconds to have the control plane reap them.
  ttlSecondsAfterFinished: null
  restartPolicy: OnFailure

  # How long to wait for the first server pod to answer before giving up.
  waitTimeoutSeconds: 300
  # How long to wait for each FOLLOWER to appear before giving up on it.
  # Under OrderedReady a follower is only created once the previous node is
  # Ready, and a sealed node is never Ready — so unsealing node N is what
  # brings node N+1 into existence. This is the per-node budget for that.
  nodeWaitTimeoutSeconds: 300
  # How long to wait for the audit endpoint to accept a test record before
  # refusing to initialise. See the pre-flight step in the bootstrap script.
  auditWaitTimeoutSeconds: 180

  # Every container this chart creates declares BOTH requests and limits for
  # BOTH cpu and memory. A namespace with a ResourceQuota covering
  # requests.cpu/limits.memory (etc.) rejects any pod with a container missing
  # the corresponding field, so "unset" is not a usable default here.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  # The kubectl-copying initContainer. Counted against the quota too: a pod's
  # effective request is max(sum of containers, max of initContainers).
  initResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  annotations: {}
  podAnnotations: {}
  # Overrides the top-level priorityClassName.
  priorityClassName: ""

  serviceAccount:
    create: true
    name: ""                  # default: <fullname>-bootstrap
    annotations: {}

  init:
    keyShares: 5
    keyThreshold: 3
    # Set true when a `seal` stanza (auto-unseal) is configured in the raft HCL.
    # OpenBao then issues RECOVERY keys instead of unseal keys, and the Job must
    # not try to unseal.
    autoUnseal: false
    # Extra flags appended to `bao operator init`.
    extraArgs: []

  unseal:
    # Unseal every replica after init. Ignored when init.autoUnseal is true.
    enabled: true

  keyOutput:
    secretName: openbao-init-keys
    labels: {}
    annotations: {}
    # Mount the key Secret read-only into the OpenBao server pods, so the keys
    # are literally files you can read and then destroy:
    #
    #   kubectl exec <pod> -- cat /openbao/init-keys/root-token
    #   kubectl delete secret <fullname>-init-keys   # removes them everywhere
    #
    # OFF by default. It is convenient for the extract-then-destroy flow, but
    # while it is on, anyone who can `exec` into an OpenBao pod can read the
    # unseal keys — a strictly wider blast radius than `get secret` on one
    # named Secret, and it persists for as long as the Secret does.
    #
    # Turning it on requires BOTH this flag and an `init-keys` entry in
    # openbao.server.volumes/volumeMounts (with `optional: true`, so pods start
    # before the Job has run). _validate.tpl enforces the pairing in both
    # directions, so a half-configured state fails the render.
    mountIntoServer: false
    mountPath: /openbao/init-keys
    # THIRD condition on the reveal gate. Even with environment=development and
    # logLevel=debug, setting this false keeps keys out of the Job log.
    revealWhenDebug: true

  # Raft autopilot, applied through the API rather than the config file.
  autopilot:
    enabled: true
    cleanupDeadServers: true
    deadServerLastContactThreshold: 10m
    serverStabilizationTime: 30s
    # Only meaningful for a cluster that can actually lose a node, so it is sent
    # only when replicas >= 3.
    minQuorum: 3

  # Revoke the initial root token once configuration is done.
  #
  # On by default. After the auth mounts, policies and roles exist there is
  # nothing left that needs root, and a root token that outlives bootstrap is a
  # standing liability: it never expires, it is in a Secret, and it is in
  # whatever the operator pasted it into.
  #
  # Nothing is lost by revoking it. A new root token can be regenerated at any
  # time from the unseal keys with `bao operator generate-root`, which is why
  # preserving those keys off-cluster matters far more than keeping this token.
  #
  # When this succeeds the `root-token` entry is deleted from the init Secret
  # and replaced with a `root-token-revoked` marker, so a stale copy cannot be
  # mistaken for a live credential.
  revokeRootToken: true

  # ---------------------------------------------------------------------------
  # JWT/OIDC auth for Kubernetes service accounts
  # ---------------------------------------------------------------------------
  # Uses the JWT auth method against the cluster's own OIDC issuer rather than
  # the Kubernetes auth method. Two reasons:
  #   - no TokenReview call, so no `system:auth-delegator` binding and no
  #     dependency on the API server being reachable on every login;
  #   - it is the same mechanism GitLab uses below, so there is one auth model
  #     to reason about instead of two.
  #
  # Because OpenBao runs inside the cluster it discovers the issuer with its own
  # mounted service account token and CA — no anonymous access to
  # /.well-known/openid-configuration and no extra RBAC. That also means no
  # egress outside the cluster, which is what makes it airgap-safe.
  #
  # Trade-off worth knowing: JWT auth validates signatures, so a token revoked
  # in Kubernetes stays valid to OpenBao until it expires. Keep TTLs short and
  # use the projected, audience-bound tokens this chart mounts.
  kubernetesAuth:
    enabled: true
    path: kubernetes
    # Audience stamped into the projected service account tokens and enforced by
    # bound_audiences. Must NOT be the default API server audience — a token
    # bound to `openbao` cannot be replayed against the Kubernetes API.
    audience: openbao
    # Set to a static issuer URL to pin `bound_issuer`. Empty means "whatever
    # discovery returns", which is right for almost everyone.
    boundIssuer: ""
    # in-cluster | jwks
    #   in-cluster  OpenBao discovers the issuer itself, authenticating with its
    #               own service account token and CA. No extra RBAC, no
    #               anonymous access, no egress. Correct in an airgap.
    #   jwks        Point straight at /openid/v1/jwks with the cluster CA. Needs
    #               the API server to serve that endpoint to OpenBao, which by
    #               default means binding system:service-account-issuer-discovery
    #               to system:unauthenticated. Use only if in-cluster fails.
    discovery: in-cluster

  # The backup service account's OIDC identity and its policy.
  snapshot:
    enabled: true
    role: bao-snapshot
    policyName: raft-snapshot
    tokenTtl: 30m
    tokenMaxTtl: 1h

  # ---------------------------------------------------------------------------
  # GitLab CI/CD OIDC, for OpenTofu
  # ---------------------------------------------------------------------------
  # Lets a GitLab pipeline exchange a short-lived ID token for an OpenBao token,
  # so CI/CD holds no long-lived credential. In the pipeline:
  #
  #   configure:
  #     id_tokens:
  #       BAO_ID_TOKEN: { aud: https://openbao.example.com }
  #     script:
  #       - export BAO_TOKEN="$(bao write -field=token auth/gitlab/login
  #           role=opentofu jwt=$BAO_ID_TOKEN)"
  #       - tofu apply
  gitlab:
    enabled: false
    path: gitlab
    # Base URL of the GitLab instance. Self-managed in an airgap is fine — this
    # is the only auth mount that talks to something outside the cluster, and it
    # only ever reaches your own GitLab.
    url: ""                   # e.g. https://gitlab.example.com
    # Defaults to url when empty.
    boundIssuer: ""
    # Must match `aud` in the pipeline's id_tokens block.
    audience: ""              # e.g. https://openbao.example.com
    # PEM CA bundle for a GitLab served by a private CA. Either paste it here or
    # reference a ConfigMap key.
    caPem: ""
    caConfigMap:
      name: ""
      key: ca.crt
    # Policies created before the roles that reference them.
    # policies:
    #   opentofu: |
    #     path "sys/mounts/*"        { capabilities = ["create","read","update","delete","list","sudo"] }
    #     path "sys/policies/acl/*"  { capabilities = ["create","read","update","delete","list"] }
    #     path "auth/*"              { capabilities = ["create","read","update","delete","list","sudo"] }
    #     path "kv/*"                { capabilities = ["create","read","update","delete","list"] }
    policies: {}
    # bound_claims are what stop any pipeline in the instance from assuming this
    # role. Always bind at least project_path; bind ref and ref_protected too
    # when the role can write.
    # roles:
    #   - name: opentofu
    #     policies: [opentofu]
    #     tokenTtl: 30m
    #     tokenMaxTtl: 1h
    #     userClaim: project_path
    #     boundClaims:
    #       project_path: platform/openbao-config
    #       ref: main
    #       ref_type: branch
    #       ref_protected: "true"
    roles: []

  # Re-run configuration after the init Secret has been destroyed. Point this
  # at a Secret holding a token with enough privilege to write policies and
  # auth mounts; it takes precedence over the stored root token.
  tokenSecret:
    name: ""
    key: token

  # Extra ACL policies applied on every run, as name -> HCL.
  policies: {}

  # Raw `bao` commands appended to the end of the script. Runs with the root
  # token still exported. Templated with tpl.
  extraCommands: ""

# -----------------------------------------------------------------------------
# External access
# -----------------------------------------------------------------------------
# Both of these target the FRONTEND listener (tls.server.port), never 8200.
# Enable at most one.
ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  labels: {}
  # TLS between the client and the ingress controller. Separate from, and
  # usually issued by the same CA as, tls.server.
  tls:
    enabled: false
    secretName: ""
  # The backend speaks HTTPS, so the controller has to be told to re-encrypt
  # rather than talk plaintext to port 8210.
  traefik:
    # Adds the annotations Traefik needs to dial the backend over HTTPS and
    # creates a ServersTransport that trusts the frontend CA (rather than
    # skipping verification).
    serversTransport:
      enabled: false
      name: ""                # default: <fullname>-frontend
      insecureSkipVerify: false
      # Defaults to the ca.crt inside the frontend certificate's Secret.
      rootCAsSecretName: ""

# OpenShift Route. Ignored on vanilla Kubernetes.
route:
  enabled: false
  host: ""
  labels: {}
  annotations: {}
  # reencrypt keeps TLS unbroken end to end while still letting the router
  # present the frontend certificate. passthrough also works and preserves
  # client-certificate auth, at the cost of the router being unable to
  # terminate.
  termination: reencrypt
  insecureEdgeTerminationPolicy: Redirect
  # For reencrypt, the router must trust what OpenBao presents on 8210. Left
  # empty, the chart injects the frontend CA from the issued Secret at deploy
  # time via the bootstrap Job; set explicitly to pin a different bundle.
  destinationCACertificate: ""

# -----------------------------------------------------------------------------
# NetworkPolicy
# -----------------------------------------------------------------------------
# A fresh namespace has no policies at all, so nothing here is redundant.
# Egress is left open by default: OpenBao needs DNS, the Kubernetes API (service
# registration and OIDC discovery), S3 for snapshots and possibly GitLab. Lock
# it down with egress.enabled once you know your endpoints.
networkPolicy:
  enabled: true
  # Deny all ingress to the namespace by default, then re-allow below.
  defaultDenyIngress: true
  # Pods in this namespace may talk to each other — required for raft.
  allowSameNamespace: true
  # Namespaces whose pods may reach the API/frontend listeners.
  allowFromNamespaces:
    - kube-system
  # Extra namespace labels allowed to scrape metrics.
  monitoring:
    enabled: true
    namespace: monitoring
  egress:
    enabled: false
    rules: []

# -----------------------------------------------------------------------------
# Raft snapshots
# -----------------------------------------------------------------------------
# This chart owns the CronJob rather than using the subchart's.
#
# The upstream template exposes only `schedule` — no concurrencyPolicy, no
# startingDeadlineSeconds, no history limits, no timeZone. Its CronJob
# therefore runs with concurrencyPolicy: Allow, so a snapshot whose upload
# outruns the schedule gets a second `snapshot save` running beside it against
# the same node. Owning it is the only way to set Forbid.
#
# Authentication is unchanged: the agent runs
#   bao write auth/$BAO_AUTH_PATH/login role=… jwt=…
# which is the same request shape for the jwt and kubernetes auth methods, so
# pointing baoAuthPath at the JWT mount needs no change to the image.
snapshotAgent:
  enabled: false

  # Daily. Snapshots are a full copy of the store, so 6-hourly mostly buys
  # storage cost; tune to your RPO.
  schedule: "0 2 * * *"
  # IANA name, e.g. "Pacific/Auckland". Empty = the kube-controller-manager's
  # zone, which is usually UTC.
  timeZone: ""

  # Forbid, not Allow: a snapshot that overruns must not have a second one
  # started beside it.
  concurrencyPolicy: Forbid
  # If the controller was down at the scheduled time, skip rather than
  # stampede once it recovers.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A failed snapshot retries twice, then waits for the next schedule.
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  restartPolicy: OnFailure
  suspend: false

  image:
    registry: ghcr.io
    repository: openbao/openbao-snapshot-agent
    tag: "0.4.1"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: ""                  # default: <fullname>-snapshot
    annotations: {}

  auth:
    # KEEP IN SYNC with bootstrap.kubernetesAuth.path
    path: kubernetes
    # KEEP IN SYNC with bootstrap.snapshot.role
    role: bao-snapshot
    # Audience-bound projected token, not the default service account token —
    # it cannot be replayed against the Kubernetes API.
    # KEEP IN SYNC with bootstrap.kubernetesAuth.audience
    audience: openbao
    tokenPath: /var/run/secrets/openbao/token
    tokenExpirationSeconds: 600

  s3:
    host: ""
    # Becomes s3cmd's --host-bucket. For path-style access this must be the
    # BARE HOST; see values-heathernetes.yaml for why.
    bucket: ""
    uri: ""
    expireDays: "30"
    extraFlags: ""
    # Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    credentialsSecret: ""
    # Or read them from OpenBao instead.
    baoSecretPath: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  extraEnv: {}
  nodeSelector: {}
  tolerations: []
  annotations: {}
  podAnnotations: {}
  priorityClassName: ""

# -----------------------------------------------------------------------------
# Monitoring
# -----------------------------------------------------------------------------
monitoring:
  # VictoriaMetrics Operator. Set false and use openbao.serverTelemetry
  # .prometheusOperator if you run the Prometheus Operator instead.
  vmServiceScrape:
    enabled: false
    interval: 30s
    labels: {}

# -----------------------------------------------------------------------------
# Audit log forwarding
# -----------------------------------------------------------------------------
# Goal: audit records must never reach a container's stdout, because everything
# on stdout is collected off the node by the cluster log collector and lands in
# a general-purpose log store that a much wider set of people can read.
#
# How the pieces fit:
#
#   OpenBao ──file device──> /openbao/audit/audit.log   (PVC, durable, of record)
#           └─http device──> audit proxy :9880 ──forward──> central Fluent Bit
#
# The `file` device is the system of record and is deliberately NOT removable by
# this chart's config: OpenBao REFUSES to serve requests when every enabled
# audit device is failing, and the `http` device is synchronous and does not
# retry. Shipping over HTTP alone would mean a Fluent Bit outage takes OpenBao
# down with it. With both enabled, a dead proxy costs you shipping latency and
# nothing else.
#
# The proxy exists rather than pointing OpenBao straight at Fluent Bit precisely
# because the http device is synchronous with no retry: the proxy accepts in
# microseconds, buffers, retries and applies backpressure on its own, keeping
# audit shipping off OpenBao's request path.
#
# Note on redaction: OpenBao HMAC-SHA256s secret values before they ever reach a
# device, so records are not plaintext secrets. But request paths, policy names,
# token accessors, client IPs and identity metadata are all in the clear, which
# is exactly the metadata you do not want in a shared log store. Keep log_raw
# off (it is off by default and this chart never sets it).
auditProxy:
  enabled: false

  # Deployment. For the strictest possible isolation run it as a sidecar on
  # 127.0.0.1 instead, so audit records never touch the pod network at all —
  # see docs/AUDIT.md for the values snippet.
  replicaCount: 2

  image:
    registry: docker.io
    repository: fluent/fluent-bit
    tag: "4.0.5"
    pullPolicy: IfNotPresent

  # Where OpenBao POSTs audit events.
  listen:
    port: 9880
    # Fluent Bit's http input derives a tag from the URI path, so the path and
    # the tag are the same string by construction.
    tag: openbao.audit
  # Fluent Bit's own metrics/health endpoint, used by the probes.
  monitorPort: 2020

  # On-disk buffering so a downstream outage does not drop records. Backed by an
  # emptyDir: the durable copy lives on the audit PVC via the file device, so
  # this buffer only has to survive a downstream blip, not a pod restart.
  buffer:
    enabled: true
    sizeLimit: 1Gi
    # Applied to the output plugin.
    totalLimitSize: 512M

  # Downstream sink.
  output:
    # forward | http | "" (buffer only, for testing)
    type: forward
    forward:
      host: ""                    # e.g. fluent-bit.logging.svc.cluster.local
      port: 24224
      sharedKey: ""
      # Existing Secret with a `shared_key` entry, preferred over sharedKey.
      sharedKeySecret: ""
      tls:
        enabled: false
        verify: true
        # Secret with ca.crt used to verify the downstream.
        caSecretName: ""
    http:
      host: ""
      port: 443
      uri: /
      format: json_lines
      tls:
        enabled: true
        verify: true
        caSecretName: ""
      headers: {}
      # Existing Secret with `authorization` for a bearer token etc.
      headerSecret: ""

    # The downstream namespace almost certainly has a default-deny ingress
    # policy, in which case shipping fails with
    #   [output:http] no upstream connections available to <host>
    # and records pile up in the buffer until it fills. Nothing is lost, but
    # nothing arrives either, and the only clue is in the proxy's own log.
    #
    # This creates a NetworkPolicy IN THE DOWNSTREAM NAMESPACE admitting just
    # the audit proxy on just the sink port. Off by default because writing
    # into another namespace is a decision for whoever owns that namespace —
    # and in a GitOps repo that policy usually belongs to the chart that owns
    # it instead.
    downstreamNetworkPolicy:
      enabled: false
      # Required when enabled. The namespace holding the sink.
      namespace: ""
      # Which pods in that namespace to open up. Empty means all of them.
      podSelector: {}
      # Defaults to the port of the active output.
      port: null

  # Fluent Bit's OWN diagnostic log level. This never contains audit records —
  # the stdout output plugin is not configured, and this chart will not render
  # one. Raising this to debug prints plugin internals, not payloads.
  logLevel: info

  # Keep the proxy's own stdout out of the cluster log collector as a belt-and
  # -braces measure. Covers the common exclusion annotations; add your own here
  # if your collector uses a different key.
  excludeFromLogCollection: true
  podAnnotations: {}

  # TLS on the OpenBao -> proxy hop.
  #
  # Off by default, and that is a considered choice rather than laziness: the
  # http audit device accepts only `uri` and `headers`, with no CA option, so it
  # validates against the container's system trust store. Turning this on
  # therefore means mounting a CA bundle over /etc/ssl/certs in the OpenBao
  # pods. The hop is pod-to-pod inside one namespace and is restricted by
  # NetworkPolicy to OpenBao pods only; see docs/AUDIT.md before enabling.
  tls:
    enabled: false
    # Issued by the BACKEND CA — the proxy is a backend component.
    secretName: ""                # default: <fullname>-audit-proxy-tls
    # ConfigMap holding a CA bundle to mount over the OpenBao trust store.
    # trust-manager is the natural producer.
    caBundleConfigMap:
      name: ""
      key: ca-certificates.crt

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  annotations: {}
  priorityClassName: ""

  serviceAccount:
    create: true
    name: ""

  # Replaces the generated fluent-bit.conf wholesale. Templated with tpl.
  # Use this to swap the proxy for something that is not Fluent Bit.
  configOverride: ""
  # Appended to the generated config — extra FILTER or OUTPUT sections.
  extraConfig: ""

# =============================================================================
# Subchart: openbao
# =============================================================================
# Everything below is the official chart's values namespace. Keys this chart
# depends on are marked KEEP IN SYNC and are validated at render time by
# templates/_validate.tpl — a mismatch fails the render with an explicit
# message rather than deploying something that silently cannot connect.
openbao:
  global:
    enabled: true
    # TLS is on: the listeners below terminate it themselves.
    # KEEP IN SYNC with tls.enabled.
    tlsDisable: false
    openshift: false

  # The agent injector and CSI provider are separate concerns; enable
  # deliberately, not by default. Resources are set regardless, so that turning
  # one on in a quota'd namespace does not fail admission.
  injector:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  csi:
    enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
    agent:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

  ui:
    enabled: true
    # Exposed through the frontend listener and the Ingress/Route, not a
    # LoadBalancer of its own.
    serviceType: ClusterIP

  server:
    image:
      registry: quay.io
      repository: openbao/openbao
      tag: ""                 # defaults to the chart's appVersion

    logLevel: info
    logFormat: json

    # OnDelete plus configAnnotation means a config change is visible as a pod
    # that needs deleting, rather than a rolling restart of a quorum.
    updateStrategyType: OnDelete
    configAnnotation: true

    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi

    # This chart owns external access, so the subchart's own Ingress/Route stay
    # off — theirs hardcode port 8200, which is the backend listener.
    ingress:
      enabled: false
    route:
      enabled: false

    # Not using the Kubernetes auth method, so the TokenReview binding is dead
    # weight. See bootstrap.kubernetesAuth for the rationale.
    authDelegator:
      enabled: false

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: null
    # Required by bootstrap.audit.
    auditStorage:
      enabled: true
      size: 5Gi
      storageClass: null

    # Pod Security "restricted" compliant. The upstream defaults omit
    # capabilities.drop, which `restricted` rejects.
    statefulSet:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

    service:
      enabled: true
      port: 8200
      targetPort: 8200
      # No frontend port here on purpose. External traffic goes through the
      # dedicated <fullname>-frontend Service this chart creates, which carries
      # the Traefik annotations and (in HA) selects only the active node.
      extraPorts: []

    # Adding an entry named `https-frontend` here is what makes the raft config
    # emit the frontend listener, so this and tls.server.enabled must be turned
    # on together. KEEP IN SYNC with tls.server.port.
    extraPorts: []
    #  - containerPort: 8210
    #    name: https-frontend
    #    protocol: TCP

    # -------------------------------------------------------------------------
    # Auto-unseal (seal stanza + plugin registration)
    # -------------------------------------------------------------------------
    # Another key the official chart does not know about; the raft HCL below
    # reads it. It lives here rather than at the top level so the config
    # template can build addresses from the release name.
    #
    # WHY THIS EXISTS: in OpenBao v2.7.0 the built-in `alicloudkms`, `awskms`,
    # `azurekeyvault`, `gcpckms`, `ocikms` and `pkcs11` seals are REMOVED from
    # the binary and remain available as external plugins only.
    # `transit` is NOT affected and stays built-in.
    #
    # A plugin SHADOWS a built-in of the same name and takes priority, so
    # registering the plugin while still on 2.6.x makes the 2.7.0 upgrade a
    # no-op rather than a flag day. Do it early.
    #
    # See values-azure.yaml and values-transit.yaml for worked examples, and
    # docs/SEAL.md for the whole picture.
    seal:
      # "" | azurekeyvault | transit
      # Anything other than "" REQUIRES bootstrap.init.autoUnseal=true — the
      # render fails otherwise, because the bootstrap would sit trying to
      # unseal a cluster that unseals itself, and would ask for the wrong kind
      # of key at init.
      type: ""

      # Where OpenBao looks for plugin binaries. Must be a real directory it
      # can read, and must not be a symlink.
      directory: /openbao/plugins
      # fail | continue — what to do when an OCI plugin download fails.
      # `fail` is right for a seal: a server that starts without its seal
      # cannot unseal anyway, and failing loudly beats failing obscurely.
      downloadBehavior: fail

      plugin:
        # Register an external plugin. Required for azurekeyvault from v2.7.0.
        enabled: false
        # Registration type; for seals this is always "kms".
        type: kms
        # MUST equal seal.type to shadow the built-in.
        name: azurekeyvault

        # How the binary reaches the plugin directory:
        #
        #   oci        OpenBao pulls the OCI image itself and extracts the
        #              binary, verifying sha256sum. Point `image` at your
        #              Artifactory Docker repo for an airgapped install.
        #   preloaded  The binary is already in `directory` — put it there with
        #              an initContainer (see values-azure.yaml, which fetches
        #              from an Artifactory generic repo) or bake it into a
        #              derived server image.
        source: oci

        # source: oci — a multi-arch index; OpenBao selects the right platform.
        image: ""              # e.g. artifactory.example.com/openbao/openbao-plugin-kms-azure:v0.1.0

        # ------------------------------------------------------------------
        # THE TWO NAMES ARE NOT THE SAME, AND THAT IS AN UPSTREAM QUIRK
        # ------------------------------------------------------------------
        # Same binary, same bytes, same sha256sum — packaged under different
        # names depending on where you get it:
        #
        #   OCI image            openbao-plugin-kms-azure
        #   release tarball      openbao-plugin-kms-azure_linux_amd64_v1
        #                        (and it is the tarball name that the published
        #                         checksums-kms-azure.txt line refers to)
        #
        # Verified by extracting both and comparing hashes. Using the wrong one
        # fails as "plugin not found" or a checksum mismatch, neither of which
        # points at the naming.

        # What OpenBao looks for inside the OCI image, and the name the binary
        # is installed under in `directory`.
        binaryName: openbao-plugin-kms-azure

        # Name inside the release tarball. Used ONLY by a preloaded-source
        # fetch step, to check the published checksum against the right file
        # before installing it as binaryName. Per-architecture.
        archiveBinary: openbao-plugin-kms-azure_linux_amd64_v1

        # source: preloaded — name of the binary inside `directory`.
        # Defaults to binaryName.
        command: ""

        # REQUIRED either way. OpenBao verifies the extracted/loaded binary
        # against this, which is what makes fetching from a mirror safe.
        # Published in checksums-kms-<provider>.txt on the plugin release, and
        # it is per-architecture — an arm64 node needs the arm64 line.
        sha256sum: ""

        args: []
        env: []

      azurekeyvault:
        vaultName: ""
        keyName: ""
        # Leave tenantId/clientId EMPTY when using workload identity — the
        # azure-workload-identity webhook injects AZURE_TENANT_ID,
        # AZURE_CLIENT_ID, AZURE_FEDERATED_TOKEN_FILE and AZURE_AUTHORITY_HOST,
        # and setting them here would take precedence over what it injected.
        tenantId: ""
        clientId: ""
        # default | environment | managed_identity | client_secret |
        # certificate | workload_identity
        #
        # workload_identity is the one to use on AKS: federated OIDC, no
        # client secret anywhere in the cluster. `default` also finds workload
        # identity, but tries a chain first and fails less clearly.
        authMethod: workload_identity
        environment: ""        # default AZUREPUBLICCLOUD
        resource: ""           # default vault.azure.net

      transit:
        # Address of the OTHER OpenBao that holds the unseal key.
        address: ""
        keyName: autounseal
        mountPath: transit/
        namespace: ""
        # Mounted CA for the remote cluster. Its own trust domain — do not
        # reuse the backend CA of this one.
        tlsCaCert: ""
        tlsServerName: ""
        tlsSkipVerify: false

    # -------------------------------------------------------------------------
    # Audit devices (declarative)
    # -------------------------------------------------------------------------
    # NOT a key the official chart knows about. This umbrella adds it, the
    # subchart ignores it, and the raft HCL below reads it to emit `audit`
    # stanzas. Keeping the device list inside the subchart values namespace is
    # what lets the config template compute the proxy address from the release
    # name instead of hardcoding it — so renaming the release cannot leave a
    # stale audit endpoint behind.
    #
    # Devices are declared in the CONFIG FILE rather than enabled through the
    # API. Consequences worth knowing:
    #   - they are applied on startup and on SIGHUP, not on demand;
    #   - they cannot be modified through the API, and cannot duplicate a device
    #     that was created through the API;
    #   - deleting a stanza deletes the device;
    #   - stanza order is the order they are applied, and `file` is first on
    #     purpose.
    #
    # !! The http device makes OpenBao's startup depend on the audit proxy
    # !! being reachable. See docs/AUDIT.md before enabling it in production.
    auditDevices:
      file:
        enabled: true
        path: file
        # Requires server.auditStorage.enabled, which mounts the PVC here.
        filePath: /openbao/audit/audit.log
        # List responses can name thousands of secrets. Eliding them cuts both
        # volume and a genuine information-leak surface.
        elideListResponses: true

      http:
        # Turn on together with the top-level auditProxy.enabled; the render
        # fails if only one of the two is set.
        enabled: false
        path: http
        # Empty -> <fullname>-audit-proxy.<namespace>.svc
        host: ""
        port: 9880
        # Fluent Bit derives its tag from the URI path.
        uriPath: openbao.audit
        elideListResponses: true

        # REQUIRED, and the single least obvious setting in this chart.
        #
        # OpenBao's http audit device does `req.Header = headers.Clone()` — it
        # REPLACES the request headers with whatever is configured here rather
        # than adding to them. Leave this empty and the POST goes out with no
        # Content-Type at all.
        #
        # Fluent Bit's http input rejects that with
        #   400  error: header 'Content-Type' is not set
        # and it is equally strict about the value: `application/json` is
        # accepted, `application/json; charset=utf-8` is a 400.
        #
        # A rejected audit device is not a soft failure. Device creation
        # happens during `operator init`, so a 400 here fails the init call
        # AFTER the barrier has already been created — leaving a cluster that
        # is initialised but whose unseal keys were never returned to anyone.
        # That cluster is unrecoverable. Do not remove this.
        headers:
          Content-Type: ["application/json"]

    # Certificates and (optionally) the init keys, mounted into the server pods.
    # KEEP IN SYNC with tls.*.secretName / tls.*.mountPath and
    # bootstrap.keyOutput.*.
    volumes:
      - name: tls-internal
        secret:
          secretName: openbao-tls-internal
          defaultMode: 0400
      - name: tls-server
        secret:
          secretName: openbao-tls-server
          defaultMode: 0400
          # optional because the frontend listener is opt-in: with
          # tls.server.enabled=false this Secret is never issued, and a
          # non-optional mount would leave the pod stuck in ContainerCreating
          # forever. When the frontend IS enabled, _validate.tpl guarantees the
          # Certificate exists, so `optional` never hides a real mistake.
          optional: true
      # To enable bootstrap.keyOutput.mountIntoServer, add:
      # - name: init-keys
      #   secret:
      #     secretName: openbao-init-keys
      #     defaultMode: 0400
      #     # optional: the Secret does not exist until the Job has run, and
      #     # deleting it to destroy the keys must not stop pods from starting.
      #     optional: true
    volumeMounts:
      - name: tls-internal
        mountPath: /openbao/tls/internal
        readOnly: true
      - name: tls-server
        mountPath: /openbao/tls/server
        readOnly: true
      # - name: init-keys
      #   mountPath: /openbao/init-keys
      #   readOnly: true

    # -------------------------------------------------------------------------
    # TLS certificate reload
    # -------------------------------------------------------------------------
    # cert-manager renews the leaf and rewrites the Secret; the kubelet updates
    # the mounted file. OpenBao does NOT pick that up on its own — it keeps
    # serving the certificate it loaded at startup. With a 90d cert renewed at
    # 30d remaining, that is a silent fuse. Verified on a live cluster: after a
    # renewal the file on disk matched the Secret while the socket still served
    # the previous serial.
    #
    # method:
    #   sighup   A sidecar polls the cert files and sends SIGHUP to bao, which
    #            reloads tls_cert_file/tls_key_file in place. Works on every
    #            version. THIS IS THE DEFAULT because it is what works on 2.6.x.
    #
    #   auto     Sets tls_auto_reload on the listener, so OpenBao polls the
    #            files itself and no sidecar is needed. This is the better
    #            answer once it is available.
    #
    #            !! NOT IN 2.6.2. The feature (PR #3530, merged 2026-07-23) is
    #            !! on main and unreleased as of v2.6.2. On an older binary
    #            !! OpenBao only WARNS —
    #            !!   "unknown or unsupported field tls_auto_reload found in
    #            !!    configuration"
    #            !! — so the option LOOKS configured and silently is not, and
    #            !! the certificate quietly goes stale. Switch to `auto` only
    #            !! after confirming that warning is absent from the server log.
    #
    # Why not a restart-based reloader (Stakater et al.): under Shamir a
    # restart SEALS the node and someone has to unseal it by hand. Both methods
    # here reload in place and leave seal state untouched.
    tlsReload:
      method: sighup
      interval: 30s

    # -------------------------------------------------------------------------
    # Break-glass root generation
    # -------------------------------------------------------------------------
    # `bao operator generate-root` mints a new root token from the unseal keys.
    # It is THE recovery path once the initial root token has been revoked —
    # and this chart revokes it by default.
    #
    # Since v2.5.3 the listener parameter
    # `disable_unauthed_generate_root_endpoints` DEFAULTS TO TRUE, so
    # /sys/generate-root/* is not served at all unless a listener explicitly
    # opts in. Without this, revoking the root token locks you out of
    # administering the cluster permanently. Verified on 2.6.2: the endpoint
    # returns `unsupported operation` with the default config.
    #
    # (Note the CLI additionally calls the legacy /sys/generate-root-token/
    # path, which is NOT the one that gets registered and returns 403. See
    # docs/RESTORE.md for the working invocation.)
    #
    # Enabled on the BACKEND listener only. That is exactly what the two trust
    # domains are for: break-glass is reachable from inside the cluster and is
    # never exposed through the Ingress/Route, which is the risk the upstream
    # default is guarding against.
    generateRootEndpoints:
      backend: true
      frontend: false

    # Required by tlsReload.method=sighup so the sidecar can signal bao. Both
    # containers run as the same uid, so the signal is permitted.
    shareProcessNamespace: true

    # Present when tlsReload.method is `sighup`; must be emptied when it is
    # `auto`. _validate.tpl enforces the pairing.
    extraContainers:
      - name: cert-reloader
        # Same image as the server: nothing extra to mirror, and it already has
        # sha256sum/pidof/kill.
        image: '{{ .Values.server.image.registry | default "quay.io" }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}'
        imagePullPolicy: '{{ .Values.server.image.pullPolicy }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        command: ["/bin/sh", "-ec"]
        args:
          - |
            # Hash every mounted leaf certificate. `find` rather than a fixed
            # list, so this works whether or not the frontend listener exists.
            fingerprint() {
              find /openbao/tls -name 'tls.crt' -type f 2>/dev/null                 | sort | xargs cat 2>/dev/null | sha256sum | cut -d' ' -f1
            }
            last="$(fingerprint)"
            echo "[cert-reloader] watching /openbao/tls every {{ (.Values.server.tlsReload | default dict).interval | default "30s" }}"
            while true; do
              sleep {{ (.Values.server.tlsReload | default dict).interval | default "30s" | trimSuffix "s" }}
              cur="$(fingerprint)"
              [ "$cur" = "$last" ] && continue
              # Empty means the mount vanished mid-read; do not signal on that.
              [ -n "$cur" ] || continue
              pid="$(pidof bao || true)"
              if [ -n "$pid" ]; then
                echo "[cert-reloader] certificate changed -- SIGHUP to bao (pid $pid)"
                kill -SIGHUP $pid && last="$cur"
              else
                echo "[cert-reloader] certificate changed but no bao process found; will retry"
              fi
            done
        volumeMounts:
          - name: tls-internal
            mountPath: /openbao/tls/internal
            readOnly: true
          # Also watched. When the frontend listener is disabled the volume is
          # optional and mounts empty, so `find` simply matches nothing.
          - name: tls-server
            mountPath: /openbao/tls/server
            readOnly: true

    ha:
      enabled: true
      replicas: 3

      # Why this is set rather than left null:
      #
      # The subchart's default api_addr is https://<pod-ip>:8200. A standby node
      # redirects clients to the leader's api_addr, and no certificate can carry
      # a pod IP SAN, so every redirect would fail hostname verification the
      # moment TLS is on. The stable per-pod DNS name is in the backend cert.
      #
      # $(VAR) is expanded by the kubelet. BAO_K8S_POD_NAME and
      # BAO_K8S_NAMESPACE are both declared before BAO_API_ADDR in the
      # subchart's env list, which is what makes this work.
      apiAddr: https://$(BAO_K8S_POD_NAME).openbao-internal.$(BAO_K8S_NAMESPACE).svc:8200
      # null -> https://$(HOSTNAME).<fullname>-internal:8201, which is correct.
      clusterAddr: null

      disruptionBudget:
        enabled: true

      raft:
        enabled: true
        setNodeId: true

        # ---------------------------------------------------------------------
        # Server configuration (HCL)
        # ---------------------------------------------------------------------
        # Rendered by the subchart with `tpl`, so template functions here run in
        # the SUBCHART's context: `.Values` is openbao's values, not this file's
        # top level. That is why paths and ports are literals.
        #
        # The frontend listener is emitted only when a `https-frontend` entry
        # exists in server.extraPorts, so disabling the frontend is a matter of
        # removing that port — the two stay consistent automatically.
        config: |
          ui = true

          # -- BACKEND listener -------------------------------------------
          # raft join, request forwarding, service registration, probes,
          # snapshot agent, injector, CSI. Trust anchor: the backend CA.
          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/openbao/tls/internal/tls.crt"
            tls_key_file    = "/openbao/tls/internal/tls.key"
            tls_min_version = "tls12"
          {{- if eq ((.Values.server.tlsReload | default dict).method | default "sighup") "auto" }}
            # Requires a build that has tls_auto_reload; 2.6.2 only warns.
            tls_auto_reload          = true
            tls_auto_reload_interval = "{{ (.Values.server.tlsReload).interval | default "30s" }}"
          {{- end }}
          {{- if (.Values.server.generateRootEndpoints | default dict).backend }}
            # Break-glass root generation. Defaults to disabled since v2.5.3, so
            # this opt-in is what makes `generate-root` possible at all after
            # the initial root token is revoked. In-cluster only.
            disable_unauthed_generate_root_endpoints = false
          {{- end }}

            # Prometheus/VictoriaMetrics scrape without a token. Reachable only
            # from inside the cluster, and gated by NetworkPolicy.
            telemetry {
              unauthenticated_metrics_access = true
            }
          }
          {{- $frontendPort := 0 }}
          {{- range .Values.server.extraPorts }}
          {{- if eq (.name | default "") "https-frontend" }}
          {{- $frontendPort = .containerPort }}
          {{- end }}
          {{- end }}
          {{- if $frontendPort }}

          # -- FRONTEND listener ------------------------------------------
          # Ingress/Route traffic only. Trust anchor: a DIFFERENT CA. It has no
          # cluster_address, so no raft peer will ever be validated against it.
          listener "tcp" {
            address         = "[::]:{{ $frontendPort }}"
            tls_cert_file   = "/openbao/tls/server/tls.crt"
            tls_key_file    = "/openbao/tls/server/tls.key"
            tls_min_version = "tls12"
          {{- if eq ((.Values.server.tlsReload | default dict).method | default "sighup") "auto" }}
            tls_auto_reload          = true
            tls_auto_reload_interval = "{{ (.Values.server.tlsReload).interval | default "30s" }}"
          {{- end }}
            # Left at the secure default on the public-facing listener: an
            # unauthenticated caller can cancel an in-flight root generation.
            disable_unauthed_generate_root_endpoints = {{ not ((.Values.server.generateRootEndpoints | default dict).frontend) }}
          }
          {{- end }}

          storage "raft" {
            path = "/openbao/data"
          {{- $fullname := include "openbao.fullname" . }}
          {{- $ns := include "openbao.namespace" . }}
          {{- range $i := until (int .Values.server.ha.replicas) }}

            # A node listing itself here is expected and harmless.
            retry_join {
              leader_api_addr     = "https://{{ $fullname }}-{{ $i }}.{{ $fullname }}-internal.{{ $ns }}.svc:8200"
              # The ONLY CA a join is validated against. A certificate from the
              # frontend issuer cannot impersonate a peer.
              leader_ca_cert_file = "/openbao/tls/internal/ca.crt"
            }
          {{- end }}
          }

          # Autopilot is deliberately NOT configured here. cleanup_dead_servers
          # and friends are not documented parameters of the raft stanza — they
          # are set through sys/storage/raft/autopilot/configuration, which the
          # bootstrap Job does. Shipping them here would either be rejected at
          # parse time or silently ignored.

          service_registration "kubernetes" {}
          {{- $ad := .Values.server.auditDevices | default dict }}
          {{- if ($ad.file).enabled }}

          # -- AUDIT devices (declarative) --------------------------------
          # Order is significant. The file device is the system of record and
          # is declared first so that it is present before anything that ships
          # off-box: OpenBao stops serving requests when EVERY enabled device
          # is failing, so a local device that cannot fail is the safety net.
          audit "file" "{{ $ad.file.path | default "file" }}" {
            description = "Durable local audit log. System of record."
            options {
              file_path            = "{{ $ad.file.filePath }}"
              elide_list_responses = "{{ $ad.file.elideListResponses }}"
            }
          }
          {{- end }}
          {{- if ($ad.http).enabled }}
          {{- $proxy := $ad.http.host | default (printf "%s-audit-proxy.%s.svc" (include "openbao.fullname" .) (include "openbao.namespace" .)) }}

          # Ships to the forward proxy, which buffers and retries. The device
          # itself is synchronous and does NOT retry, which is exactly why the
          # proxy exists and why the file device above is not optional.
          audit "http" "{{ $ad.http.path | default "http" }}" {
            description = "Forward audit records to the audit proxy."
            options {
              uri                  = "http://{{ $proxy }}:{{ $ad.http.port }}/{{ $ad.http.uriPath }}"
              elide_list_responses = "{{ $ad.http.elideListResponses }}"
              {{- with $ad.http.headers }}
              # Replaces the request headers wholesale, so Content-Type must be
              # in here or the POST is sent without one.
              headers              = {{ toJson . | quote }}
              {{- end }}
            }
          }
          {{- end }}

          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname          = true
          }

          {{- $seal := .Values.server.seal | default dict }}
          {{- if $seal.type }}

          # -- AUTO-UNSEAL -------------------------------------------------
          {{- if ($seal.plugin).enabled }}
          # Only emitted when a plugin is actually registered: OpenBao requires
          # plugin_directory to be a real, readable, non-symlink directory, so
          # naming one that is not mounted fails startup for no reason.
          plugin_directory         = "{{ $seal.directory }}"
          plugin_download_behavior = "{{ $seal.downloadBehavior }}"

          # External seal plugin. The built-in cloud seals are removed in
          # v2.7.0; a plugin of the SAME NAME shadows the built-in and takes
          # priority, so this can be registered before upgrading.
          #
          # sha256sum is not optional: it is what makes pulling the binary from
          # a mirror or Artifactory safe.
          plugin "{{ $seal.plugin.type | default "kms" }}" "{{ $seal.plugin.name }}" {
            {{- if eq ($seal.plugin.source | default "preloaded") "oci" }}
            image       = "{{ $seal.plugin.image }}"
            binary_name = "{{ $seal.plugin.binaryName }}"
            {{- else }}
            command     = "{{ $seal.plugin.command | default $seal.plugin.binaryName }}"
            {{- end }}
            sha256sum   = "{{ $seal.plugin.sha256sum }}"
            {{- with $seal.plugin.args }}
            args        = {{ toJson . }}
            {{- end }}
            {{- with $seal.plugin.env }}
            env         = {{ toJson . }}
            {{- end }}
          }
          {{- end }}
          {{- if eq $seal.type "azurekeyvault" }}
          {{- $akv := $seal.azurekeyvault }}

          seal "azurekeyvault" {
            vault_name  = "{{ $akv.vaultName }}"
            key_name    = "{{ $akv.keyName }}"
            {{- with $akv.authMethod }}
            # workload_identity reads AZURE_CLIENT_ID, AZURE_TENANT_ID,
            # AZURE_FEDERATED_TOKEN_FILE and AZURE_AUTHORITY_HOST, all injected
            # by the azure-workload-identity webhook. No secret in the cluster.
            auth_method = "{{ . }}"
            {{- end }}
            {{- with $akv.tenantId }}
            tenant_id   = "{{ . }}"
            {{- end }}
            {{- with $akv.clientId }}
            client_id   = "{{ . }}"
            {{- end }}
            {{- with $akv.environment }}
            environment = "{{ . }}"
            {{- end }}
            {{- with $akv.resource }}
            resource    = "{{ . }}"
            {{- end }}
          }
          {{- else if eq $seal.type "transit" }}
          {{- $tr := $seal.transit }}

          # The token comes from BAO_TOKEN / seal env vars, never from here —
          # this file is a ConfigMap.
          seal "transit" {
            address         = "{{ $tr.address }}"
            key_name        = "{{ $tr.keyName }}"
            mount_path      = "{{ $tr.mountPath }}"
            {{- with $tr.namespace }}
            namespace       = "{{ . }}"
            {{- end }}
            {{- with $tr.tlsCaCert }}
            tls_ca_cert     = "{{ . }}"
            {{- end }}
            {{- with $tr.tlsServerName }}
            tls_server_name = "{{ . }}"
            {{- end }}
            {{- if $tr.tlsSkipVerify }}
            tls_skip_verify = true
            {{- end }}
          }
          {{- end }}
          {{- end }}

  # The subchart's CronJob is deliberately off — this chart ships its own so
  # that concurrencyPolicy and friends can be set. See the top-level
  # `snapshotAgent` section.
  snapshotAgent:
    enabled: false

# =============================================================================
# Restore
# =============================================================================
# See docs/RESTORE.md. The short version, because it is counterintuitive and
# getting it wrong wastes an outage:
#
#   A raft snapshot contains the ENCRYPTED store, including the barrier keyring.
#   It does NOT contain the unseal/recovery keys. Restoring a snapshot into a
#   cluster whose master key differs from the one that took it therefore
#   produces data nobody can decrypt — unless you also still hold the ORIGINAL
#   unseal keys, which is why the init Secret must be preserved off-cluster.
#
# Two very different operations share one command:
#
#   same-cluster  Roll this cluster back to an earlier point. Seal config is
#                 unchanged, so no -force, and the cluster stays unsealed.
#                 Genuinely mechanical, and safe to automate — that is what
#                 this Job does.
#
#   new-cluster   Rebuild after total loss. Needs -force, and afterwards the
#                 cluster must be unsealed with the ORIGINAL keys and accessed
#                 with the ORIGINAL root token; the ones from the throwaway
#                 init are dead the moment the restore lands. This Job can
#                 perform the restore step, but the surrounding sequence is a
#                 judgement call and belongs in the runbook.
restore:
  enabled: false

  # Safety interlock. The Job renders only when this exactly equals the value of
  # `snapshot` below. It exists so that `restore.enabled=true` left behind in a
  # values file — or replayed by a GitOps sync — cannot by itself overwrite a
  # live cluster's storage.
  confirm: ""

  # Object to restore, relative to source.s3.uri. "latest" resolves to the most
  # recently modified object at that prefix.
  snapshot: ""

  # same-cluster | new-cluster   (new-cluster adds -force)
  mode: same-cluster

  source:
    # s3 | pvc | url
    type: s3
    s3:
      uri: ""                   # defaults to the snapshot agent's s3Uri
      host: ""
      bucket: ""
      credentialsSecret: ""     # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      extraFlags: ""
    pvc:
      claimName: ""
      path: ""
    url: ""

  # Token used for the restore call. Defaults to the root token in the init
  # Secret; set this when that Secret has been destroyed, as it should be.
  tokenSecret:
    name: ""
    key: token

  # Fetch and inspect the snapshot, then stop without writing anything. Always
  # worth doing first — it proves the object exists, is readable and is a valid
  # snapshot, which is most of what goes wrong.
  dryRun: false

  # Uses the snapshot agent image: it already carries both `bao` and `s3cmd`,
  # so an airgap mirror needs nothing new.
  image:
    registry: ghcr.io
    repository: openbao/openbao-snapshot-agent
    tag: "0.4.1"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  backoffLimit: 0               # never silently retry a destructive operation
  activeDeadlineSeconds: 1800
  annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
