{{- if .Values.auditProxy.enabled }}
{{- $fullname := include "obp.baoFullname" . }}
{{- $ns := include "obp.namespace" . }}
{{- $ap := .Values.auditProxy }}
{{- $name := printf "%s-audit-proxy" $fullname }}
{{- $sa := $ap.serviceAccount.name | default $name }}
{{- $tlsSecret := $ap.tls.secretName | default (printf "%s-tls" $name) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-proxy
data:
  fluent-bit.conf: |
{{- if $ap.configOverride }}
    {{- tpl $ap.configOverride . | nindent 4 }}
{{- else }}
    # =====================================================================
    # OpenBao audit forward proxy
    # =====================================================================
    # Accepts audit records from OpenBao's http audit device and forwards them
    # onward with buffering and retry.
    #
    # There is deliberately NO [OUTPUT] Name stdout section here, and this
    # chart will not render one. Audit records on a container's stdout are
    # collected off the node into a general-purpose log store, which is exactly
    # the exposure this proxy exists to avoid. Log_Level below controls Fluent
    # Bit's own diagnostics, never record payloads.
    [SERVICE]
        Flush                     1
        Grace                     10
        Daemon                    Off
        Log_Level                 {{ $ap.logLevel }}
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 {{ $ap.monitorPort }}
        Health_Check              On
{{- if $ap.buffer.enabled }}
        storage.path              /var/log/flb-storage/
        storage.sync              normal
        storage.checksum          Off
        storage.backlog.mem_limit 32M
{{- end }}

    # OpenBao POSTs one JSON object per audited request.
    [INPUT]
        Name                      http
        Listen                    0.0.0.0
        Port                      {{ $ap.listen.port }}
        Tag                       {{ $ap.listen.tag }}
{{- if $ap.tls.enabled }}
        tls                       On
        tls.verify                Off
        tls.crt_file              /fluent-bit/tls/tls.crt
        tls.key_file              /fluent-bit/tls/tls.key
{{- end }}
{{- if $ap.buffer.enabled }}
        storage.type              filesystem
{{- end }}

    # Mark the source so the downstream can route audit records to storage with
    # tighter access control than ordinary application logs.
    [FILTER]
        Name                      modify
        Match                     {{ $ap.listen.tag }}
        Add                       log_source openbao-audit
        Add                       openbao_cluster {{ .Release.Name }}
        Add                       openbao_namespace {{ $ns }}

{{- if eq $ap.output.type "forward" }}
    [OUTPUT]
        Name                      forward
        Match                     {{ $ap.listen.tag }}
        Host                      {{ $ap.output.forward.host }}
        Port                      {{ $ap.output.forward.port }}
        Retry_Limit               False
{{- if $ap.buffer.enabled }}
        storage.total_limit_size  {{ $ap.buffer.totalLimitSize }}
{{- end }}
{{- if or $ap.output.forward.sharedKey $ap.output.forward.sharedKeySecret }}
        Shared_Key                ${FLB_SHARED_KEY}
        Self_Hostname             {{ $name }}
{{- end }}
{{- if $ap.output.forward.tls.enabled }}
        tls                       On
        tls.verify                {{ ternary "On" "Off" $ap.output.forward.tls.verify }}
{{- if $ap.output.forward.tls.caSecretName }}
        tls.ca_file               /fluent-bit/downstream-ca/ca.crt
{{- end }}
{{- end }}
{{- else if eq $ap.output.type "http" }}
    [OUTPUT]
        Name                      http
        Match                     {{ $ap.listen.tag }}
        Host                      {{ $ap.output.http.host }}
        Port                      {{ $ap.output.http.port }}
        URI                       {{ $ap.output.http.uri }}
        Format                    {{ $ap.output.http.format }}
        Retry_Limit               False
{{- if $ap.buffer.enabled }}
        storage.total_limit_size  {{ $ap.buffer.totalLimitSize }}
{{- end }}
{{- range $k, $v := $ap.output.http.headers }}
        Header                    {{ $k }} {{ $v }}
{{- end }}
{{- if $ap.output.http.headerSecret }}
        Header                    Authorization ${FLB_AUTHORIZATION}
{{- end }}
{{- if $ap.output.http.tls.enabled }}
        tls                       On
        tls.verify                {{ ternary "On" "Off" $ap.output.http.tls.verify }}
{{- if $ap.output.http.tls.caSecretName }}
        tls.ca_file               /fluent-bit/downstream-ca/ca.crt
{{- end }}
{{- end }}
{{- else }}
    # output.type is empty: records are accepted and buffered but not forwarded.
    # Useful only for testing the OpenBao -> proxy hop in isolation.
    [OUTPUT]
        Name                      null
        Match                     {{ $ap.listen.tag }}
{{- end }}
{{- with $ap.extraConfig }}

    {{- tpl . $ | nindent 4 }}
{{- end }}
{{- end }}
{{- with $ap.output.downstreamNetworkPolicy }}
{{- if .enabled }}
{{- if not .namespace }}
{{- fail "openbao-platform: auditProxy.output.downstreamNetworkPolicy.enabled is true but no namespace is set." }}
{{- end }}
---
# Created in the DOWNSTREAM namespace, not this one. Without it a default-deny
# ingress policy there silently swallows every shipped record.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "allow-%s-audit" $fullname | trunc 63 | trimSuffix "-" }}
  namespace: {{ .namespace }}
  labels:
    {{- include "obp.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- if .podSelector }}
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
    {{- else }}
    {}
    {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: audit-proxy
      ports:
        - port: {{ .port | default (ternary $ap.output.http.port $ap.output.forward.port (eq $ap.output.type "http")) }}
          protocol: TCP
{{- end }}
{{- end }}
{{- if $ap.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-proxy
# The proxy never calls the API server.
automountServiceAccountToken: false
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: audit-proxy
  ports:
    - name: audit
      port: {{ $ap.listen.port }}
      targetPort: audit
      protocol: TCP
    - name: monitor
      port: {{ $ap.monitorPort }}
      targetPort: monitor
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-proxy
  {{- with $ap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $ap.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: audit-proxy
  template:
    metadata:
      labels:
        {{- include "obp.labels" . | nindent 8 }}
        app.kubernetes.io/component: audit-proxy
      annotations:
        # Restart on a config change; Deployments do not watch ConfigMaps.
        # Hashed from the values rather than the rendered file, because the
        # ConfigMap lives in this same template and including it here would
        # recurse.
        checksum/config: {{ toYaml $ap | sha256sum | trunc 32 }}
        {{- if $ap.excludeFromLogCollection }}
        # Belt and braces. Audit records are not written to this container's
        # stdout at all, but if a future config change ever leaked one, these
        # keep it out of the cluster log store. Keys differ per collector, so
        # the common ones are all set; add yours via auditProxy.podAnnotations.
        fluentbit.io/exclude: "true"
        logging.coreos.com/exclude: "true"
        vector.dev/exclude: "true"
        {{- end }}
        {{- with $ap.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: false
      {{- include "obp.priorityClassName" (dict "root" $ "component" $ap) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with $ap.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ap.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $ap.affinity }}
      affinity:
        {{- toYaml $ap.affinity | nindent 8 }}
      {{- else if gt (int $ap.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: audit-proxy
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: fluent-bit
          image: "{{ $ap.image.registry }}/{{ $ap.image.repository }}:{{ $ap.image.tag }}"
          imagePullPolicy: {{ $ap.image.pullPolicy }}
          args:
            - --config=/fluent-bit/etc/fluent-bit.conf
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $ap.resources | nindent 12 }}
          ports:
            - name: audit
              containerPort: {{ $ap.listen.port }}
              protocol: TCP
            - name: monitor
              containerPort: {{ $ap.monitorPort }}
              protocol: TCP
          env:
            {{- if $ap.output.forward.sharedKeySecret }}
            - name: FLB_SHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $ap.output.forward.sharedKeySecret }}
                  key: shared_key
            {{- else if $ap.output.forward.sharedKey }}
            - name: FLB_SHARED_KEY
              value: {{ $ap.output.forward.sharedKey | quote }}
            {{- end }}
            {{- if $ap.output.http.headerSecret }}
            - name: FLB_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ $ap.output.http.headerSecret }}
                  key: authorization
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: buffer
              mountPath: /var/log/flb-storage
            {{- if $ap.tls.enabled }}
            - name: tls
              mountPath: /fluent-bit/tls
              readOnly: true
            {{- end }}
            {{- if or (and (eq $ap.output.type "forward") $ap.output.forward.tls.caSecretName) (and (eq $ap.output.type "http") $ap.output.http.tls.caSecretName) }}
            - name: downstream-ca
              mountPath: /fluent-bit/downstream-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: buffer
          # emptyDir, not a PVC: the durable copy of every record is already on
          # the audit PVC via the file device, so this only has to survive a
          # downstream blip. It also keeps replicaCount > 1 possible, which a
          # ReadWriteOnce PVC would not.
          emptyDir:
            sizeLimit: {{ $ap.buffer.sizeLimit }}
        {{- if $ap.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if and (eq $ap.output.type "forward") $ap.output.forward.tls.caSecretName }}
        - name: downstream-ca
          secret:
            secretName: {{ $ap.output.forward.tls.caSecretName }}
        {{- else if and (eq $ap.output.type "http") $ap.output.http.tls.caSecretName }}
        - name: downstream-ca
          secret:
            secretName: {{ $ap.output.http.tls.caSecretName }}
        {{- end }}
      {{- with ((index .Values "openbao").global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
