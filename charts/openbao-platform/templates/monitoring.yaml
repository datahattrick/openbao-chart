{{- if .Values.monitoring.vmServiceScrape.enabled }}
{{- $fullname := include "obp.baoFullname" . }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ $fullname }}
  namespace: {{ include "obp.namespace" . }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.vmServiceScrape.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ include "obp.namespace" . }}
  endpoints:
    # The backend listener, whose telemetry stanza sets
    # unauthenticated_metrics_access — so no token is needed. It is reachable
    # only from inside the cluster and only from the monitoring namespace, per
    # the allow-monitoring-scrape NetworkPolicy.
    # The subchart names the 8200 service port after the scheme, so with TLS on
    # it is literally "https".
    - port: https
      scheme: https
      path: /v1/sys/metrics
      params:
        format: ["prometheus"]
      interval: {{ .Values.monitoring.vmServiceScrape.interval }}
      tlsConfig:
        # Served by the backend CA, which lives in a Secret in this namespace.
        # vmagent runs in the monitoring namespace and cannot read it, so name
        # verification is off while the connection itself stays encrypted.
        insecureSkipVerify: true
{{- end }}
