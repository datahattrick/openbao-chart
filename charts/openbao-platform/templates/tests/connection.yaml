{{- $fullname := include "obp.baoFullname" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-connection
  namespace: {{ include "obp.namespace" . }}
  labels:
    {{- include "obp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after a successful run so the log stays readable. Replaced on the
    # next run rather than deleted after this one.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  {{- include "obp.priorityClassName" (dict "root" $ "component" dict) | nindent 2 }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: "{{ ((index .Values "openbao").server.image).registry | default "quay.io" }}/{{ ((index .Values "openbao").server.image).repository | default "openbao/openbao" }}:{{ ((index .Values "openbao").server.image).tag | default (trimPrefix "v" .Chart.AppVersion) }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # The subchart ships its own test Pod with NO resources, which a
      # ResourceQuota rejects. This one declares them.
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      env:
        - name: HOME
          value: /tmp
        - name: BAO_ADDR
          value: {{ include "obp.baoInternalAddr" . | quote }}
        {{- if .Values.tls.enabled }}
        - name: BAO_CACERT
          value: {{ include "obp.internalCaPath" . | quote }}
        {{- end }}
      command: ["/bin/sh", "-ec"]
      args:
        - |
          echo "== reaching the backend listener over TLS, verifying against the backend CA =="
          bao status
          echo "== raft peers =="
          bao status | grep -q "Storage Type.*raft" && echo "raft storage confirmed"
          echo "OK"
      volumeMounts:
        {{- if .Values.tls.enabled }}
        - name: tls-internal
          mountPath: {{ .Values.tls.internal.mountPath }}
          readOnly: true
        {{- end }}
        - name: tmp
          mountPath: /tmp
  volumes:
    {{- if .Values.tls.enabled }}
    - name: tls-internal
      secret:
        secretName: {{ include "obp.internalTlsSecret" . }}
    {{- end }}
    - name: tmp
      emptyDir: {}
