# Environment: Azure — auto-unseal with Azure Key Vault via Workload Identity.
#
#   helm upgrade --install openbao openbao/ -n openbao \
#     -f openbao/examples/values-prod.yaml \
#     -f openbao/examples/values-azure.yaml
#
# PREREQUISITES OUTSIDE THIS CHART
#   1. A Key Vault and a key, with the workload's managed identity granted
#      Key Vault Crypto User (wrapKey/unwrapKey/get) on it.
#   2. A federated credential on that identity:
#        issuer  = the AKS cluster's OIDC issuer URL
#        subject = system:serviceaccount:<namespace>:<serviceaccount name>
#        audience= api://AzureADTokenExchange
#   3. The azure-workload-identity webhook installed in the cluster. It is what
#      injects AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE /
#      AZURE_AUTHORITY_HOST, and it only mutates pods carrying the
#      `azure.workload.identity/use: "true"` label.

bootstrap:
  init:
    # Mandatory with any seal. OpenBao issues RECOVERY keys instead of unseal
    # keys, and the Job must not try to unseal a cluster that unseals itself.
    # The render fails if this disagrees with the seal.
    autoUnseal: true
    # Recovery keys authorise recovery operations (generate-root, rekey). They
    # do NOT unseal anything. Store them exactly as carefully as unseal keys —
    # and note that losing the Key Vault key is unrecoverable regardless.
    keyShares: 5
    keyThreshold: 3

openbao:
  server:
    # The webhook only mutates pods with this label.
    extraLabels:
      azure.workload.identity/use: "true"

    serviceAccount:
      create: true
      annotations:
        # The user-assigned managed identity's client ID.
        azure.workload.identity/client-id: "CHANGEME-00000000-0000-0000-0000-000000000000"
        # Optional; defaults to the cluster's tenant.
        # azure.workload.identity/tenant-id: "..."

    seal:
      type: azurekeyvault
      directory: /openbao/plugins
      # fail | warn
      downloadBehavior: fail
      # plugin_auto_download. Defaults to FALSE upstream, and source: oci is
      # useless without it — nothing would ever fetch the image.
      autoDownload: true
      # A kms plugin does not need catalog registration; leave it off unless
      # you set plugin.args or plugin.env, which are ignored without it.
      autoRegister: false

      azurekeyvault:
        vaultName: CHANGEME-kv
        keyName: openbao-unseal
        # Federated OIDC — no client secret anywhere in the cluster.
        # tenantId/clientId stay EMPTY: the webhook injects them, and setting
        # them here would override what it injected.
        authMethod: workload_identity
        # environment: AZUREUSGOVERNMENT   # for sovereign clouds
        # resource: vault.usgovcloudapi.net

      plugin:
        # Required from OpenBao v2.7.0, harmless before it: a plugin shadows
        # the built-in of the same name, so registering it now makes the 2.7.0
        # upgrade a no-op.
        enabled: true
        type: kms
        name: azurekeyvault          # must equal seal.type to shadow the built-in

        # ------------------------------------------------------------------
        # DELIVERY — pick one. Both work without public internet.
        # ------------------------------------------------------------------
        #
        # (a) source: oci  — OpenBao pulls the image itself and extracts the
        #     binary, verifying sha256sum. Point `image` at your Artifactory
        #     Docker repo. Fewest moving parts; no initContainer.
        #
        # (b) source: preloaded — an initContainer puts the binary in
        #     `directory` first. Use when Artifactory serves the release
        #     tarball from a GENERIC repo rather than as an OCI image, or when
        #     egress from the OpenBao pod itself is not permitted. See
        #     extraInitContainers below.
        source: oci
        # Upstream publishes a multi-arch index at
        #   ghcr.io/openbao/openbao-plugin-kms-azure:v0.1.0
        # Mirror that into Artifactory and point this at your copy.
        #
        # NOTE THE MISSING TAG. OpenBao assembles the reference itself as
        # image + ":" + version; leaving the tag on `image` produces
        #   image and version do not form a valid image reference
        # at startup. A registry PORT is fine — only a trailing :tag is not.
        image: CHANGEME-artifactory.example.com/openbao/openbao-plugin-kms-azure
        # The tag, and a required field of the plugin stanza in both delivery
        # modes. Keep it in step with sha256sum below.
        version: v0.1.0

        # Name inside the OCI image, and the installed name.
        binaryName: openbao-plugin-kms-azure
        command: openbao-plugin-kms-azure
        # Name inside the release tarball — used only by the fetch
        # initContainer below. Change the arch suffix for non-amd64 nodes and
        # take the matching sha256sum line.
        archiveBinary: openbao-plugin-kms-azure_linux_amd64_v1

        # NOT OPTIONAL. OpenBao verifies the binary against this, which is what
        # makes pulling from a mirror safe. Upstream value for
        # kms-azure v0.1.0, linux/amd64 — re-derive it for any other
        # version or architecture from checksums-kms-azure.txt on the release:
        #   https://github.com/openbao/openbao-plugins/releases/tag/kms-azure-v0.1.0
        sha256sum: e46a6d13ab427b594c89e58b002db6bbb6d61557f5de8a599557c76827deef0d

        # Artifactory behind a private CA. The SERVER process performs the
        # pull and there is no per-plugin CA option, so the bundle has to be in
        # its trust store or startup fails with
        #   x509: certificate signed by unknown authority
        # reported by the plugin download, not by the seal.
        #
        # This declares the intent; the volume, the volumeMount and the
        # SSL_CERT_DIR entry below are what actually do it, and the render
        # fails if any of the three is missing.
        registryCA:
          configMap: CHANGEME-artifactory-ca-bundle
          key: ca-bundle.crt
          mountPath: /openbao/tls/registry

        # Credentials for the same registry. NOT an imagePullSecret — the
        # kubelet is not making this pull — though the same
        # kubernetes.io/dockerconfigjson Secret can be reused for both.
        # Without credentials the pull is attempted anonymously and Artifactory
        # answers 401.
        registryAuth:
          secretName: CHANGEME-artifactory-pull
          key: .dockerconfigjson
          mountPath: /openbao/.docker

    # The plugin directory must be a real, writable, non-symlink directory.
    # An emptyDir is enough — the binary is re-fetched or re-extracted on every
    # start, and sha256sum is verified each time.
    volumes:
      - name: tls-internal
        secret: { secretName: openbao-tls-internal, defaultMode: 0400 }
      - name: tls-server
        secret: { secretName: openbao-tls-server, defaultMode: 0400 }
      # init-keys is deliberately NOT mounted: bootstrap.keyOutput.mountIntoServer
      # defaults to false so the keys are not readable by anyone who can exec
      # into a pod. Add it back together with that flag if you want the
      # extract-from-the-pod flow.
      - name: plugins
        emptyDir: {}
      # The registry's CA. A ConfigMap volume presents each key as a symlink
      # into ..data/, which Go follows, so SSL_CERT_DIR reads it correctly.
      - name: registry-ca
        configMap:
          name: CHANGEME-artifactory-ca-bundle
      # `items` is not optional. The credential loader opens
      # <DOCKER_CONFIG>/config.json by that exact filename; mounted plainly the
      # file would be called `.dockerconfigjson`, never be found, and the pull
      # would fall back to anonymous.
      - name: registry-auth
        secret:
          secretName: CHANGEME-artifactory-pull
          defaultMode: 0400
          items:
            - key: .dockerconfigjson
              path: config.json
      # Writable scratch for the fetch initContainer, which runs with
      # readOnlyRootFilesystem.
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - { name: tls-internal, mountPath: /openbao/tls/internal, readOnly: true }
      - { name: tls-server,   mountPath: /openbao/tls/server,   readOnly: true }
      - { name: plugins,      mountPath: /openbao/plugins }
      - { name: registry-ca,  mountPath: /openbao/tls/registry, readOnly: true }
      - { name: registry-auth, mountPath: /openbao/.docker, readOnly: true }

    # SSL_CERT_DIR REPLACES Go's default certificate directories rather than
    # extending them, so this is a colon-separated list and BOTH entries have
    # to be here: dropping the backend CA breaks the http audit device, which
    # stops OpenBao serving requests. Public roots are unaffected — they come
    # from a default bundle FILE that SSL_CERT_DIR does not touch.
    extraEnvironmentVars:
      SSL_CERT_DIR: /openbao/tls/internal:/openbao/tls/registry
      # The DIRECTORY holding config.json, not the file. Of the four places
      # credentials are looked for, this is the only one that wins
      # deterministically.
      DOCKER_CONFIG: /openbao/.docker

    # ----------------------------------------------------------------------
    # DELIVERY (b): fetch from an Artifactory generic repo.
    # Only needed when seal.plugin.source is `preloaded`. Leave commented out
    # for source: oci.
    #
    # Rendered with tpl in the subchart's context, so it can read
    # .Values.server.seal.* directly and cannot drift from the seal config.
    # ----------------------------------------------------------------------
    extraInitContainers: []
    # - name: fetch-seal-plugin
    #   image: docker.io/curlimages/curl:8.11.1
    #   imagePullPolicy: IfNotPresent
    #   securityContext:
    #     allowPrivilegeEscalation: false
    #     readOnlyRootFilesystem: true
    #     capabilities: { drop: ["ALL"] }
    #   resources:
    #     requests: { cpu: 50m, memory: 64Mi }
    #     limits:   { cpu: 500m, memory: 128Mi }
    #   command: ["/bin/sh", "-ec"]
    #   args:
    #     - |
    #       # Artifactory generic repo serving the upstream release tarball.
    #       URL="CHANGEME-https://artifactory.example.com/artifactory/openbao/openbao-plugin-kms-azure_linux_amd64_v1.tar.gz"
    #       WANT="{{ .Values.server.seal.plugin.sha256sum }}"
    #       # ARCHIVE_BIN is the name in the tarball and in the checksum line;
    #       # BIN is what OpenBao will look for. They differ upstream.
    #       ARCHIVE_BIN="{{ .Values.server.seal.plugin.archiveBinary }}"
    #       BIN="{{ .Values.server.seal.plugin.command | default .Values.server.seal.plugin.binaryName }}"
    #       DIR="{{ .Values.server.seal.directory }}"
    #
    #       cd /tmp
    #       # --cacert for a private CA; add -u for an Artifactory API key.
    #       curl -fsSL ${ARTIFACTORY_CA:+--cacert $ARTIFACTORY_CA} \
    #            ${ARTIFACTORY_TOKEN:+-H "Authorization: Bearer $ARTIFACTORY_TOKEN"} \
    #            -o plugin.tar.gz "$URL"
    #       tar xzf plugin.tar.gz
